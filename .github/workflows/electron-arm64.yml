name: Electron CI - ARM64

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  build-arm64:
    name: Build and Test with Electron ${{ matrix.electron-version }} on Node ${{ matrix.node-version }} - Linux ARM64
    runs-on: ubuntu-24.04-arm

    strategy:
      fail-fast: false
      matrix:
        electron-version: ['39.2.7', '44.3.0']
        # Each Electron version builds against its own Node line, so Node is
        # paired with the Electron version rather than varied independently.
        include:
          - electron-version: '39.2.7'
            node-version: '22'
          - electron-version: '44.3.0'
            node-version: '24'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Show tool versions
      run: |
        node --version
        npm --version

    - name: Install system dependencies
      run: |
        sudo apt-get update
        # Ubuntu 24.04 renamed several of these with a t64 suffix (the 64-bit
        # time_t transition); fall back to the old names on older releases.
        sudo apt-get install -y build-essential python3 \
          libgtk-3-0t64 libnss3 libasound2t64 libatspi2.0-0t64 libcups2t64 \
          libnotify4 libxss1 libgbm1 libdrm2 \
        || sudo apt-get install -y build-essential python3 \
          libgtk-3-0 libnss3 libasound2 libatspi2.0-0 libcups2 \
          libnotify4 libxss1 libgbm1 libdrm2

    - name: Install npm dependencies
      run: npm install

    - name: Install Electron rebuild tools
      run: npm install --save-dev @electron/rebuild electron@${{ matrix.electron-version }}

    - name: Rebuild for Electron
      run: npx @electron/rebuild --version ${{ matrix.electron-version }}

    - name: Run tests with Electron (as Node)
      run: ELECTRON_RUN_AS_NODE=1 npx electron node_modules/.bin/mocha test/**/*.test.js --timeout 10000

    - name: Verify native module
      run: |
        if [ -f "build/Release/sqlanywhere.node" ]; then
          echo "✓ Native module built successfully"
          ls -lh build/Release/sqlanywhere.node
          file build/Release/sqlanywhere.node || true
        else
          echo "✗ Native module NOT found"
          exit 1
        fi

    - name: Test Electron module loading
      run: |
        ELECTRON_RUN_AS_NODE=1 npx electron --version
        ELECTRON_RUN_AS_NODE=1 npx electron test/electron-load-test.js
