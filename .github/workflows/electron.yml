name: Electron CI

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  build:
    name: Build and Test with Electron ${{ matrix.electron-version }} on Node ${{ matrix.node-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-14, ubuntu-latest, windows-latest]
        electron-version: ['39.2.7', '44.3.0']
        exclude:
          # Electron 39 builds on Node 22, whose bundled node-gyp (11.5.0)
          # cannot identify the Visual Studio 2026 on windows-latest.
          - os: windows-latest
            electron-version: '39.2.7'
        include:
          - electron-version: '39.2.7'
            node-version: '22'
          - electron-version: '44.3.0'
            node-version: '24'
          # ...so that combination builds against VS 2022 on the older image.
          - os: windows-2022
            electron-version: '39.2.7'
            node-version: '22'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Show tool versions
      shell: bash
      run: |
        node --version
        npm --version

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb build-essential python3 libgtk-3-dev libnotify-dev libnss3 libxss1 libasound2t64 || sudo apt-get install -y xvfb libasound2

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        # Xcode Command Line Tools should be pre-installed
        echo "macOS build tools ready"

    - name: Install npm dependencies
      run: npm install

    - name: Install Electron rebuild tools
      run: npm install --save-dev @electron/rebuild electron@${{ matrix.electron-version }} electron-mocha

    - name: Rebuild for Electron
      run: npx @electron/rebuild --version ${{ matrix.electron-version }}

    - name: Run tests with Electron
      shell: bash
      run: |
        # Electron needs a display; the Linux runners are headless.
        RUN=()
        if [ "$RUNNER_OS" = "Linux" ]; then
          RUN=(xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24")
        fi
        "${RUN[@]}" npx electron-mocha --no-sandbox test/**/*.test.js --timeout 10000

    - name: Show build output
      shell: bash
      run: |
        echo "Checking for native module..."
        if [ -f "build/Release/sqlanywhere.node" ]; then
          echo "✓ Native module found"
          ls -lh build/Release/sqlanywhere.node
          file build/Release/sqlanywhere.node || true
        else
          echo "✗ Native module NOT found"
          echo "Build directory contents:"
          ls -la build/ || echo "Build directory does not exist"
        fi

    - name: Test module loading with Electron
      shell: bash
      run: |
        RUN=()
        if [ "$RUNNER_OS" = "Linux" ]; then
          RUN=(xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24")
        fi
        # --version prints without starting the GUI, so it needs no display.
        npx electron --no-sandbox --version
        "${RUN[@]}" npx electron --no-sandbox test/electron-load-test.js
