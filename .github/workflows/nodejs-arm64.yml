name: Node.js CI - ARM64

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  build-arm64:
    name: Build and Test on Node ${{ matrix.node-version }} - Linux ARM64
    runs-on: ubuntu-24.04-arm

    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Show tool versions
      run: |
        node --version
        npm --version

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential python3

    - name: Install npm dependencies
      run: npm install

    - name: Run tests
      run: npm test

    - name: Verify native module
      run: |
        if [ -f "build/Release/sqlanywhere.node" ]; then
          echo "✓ Native module built successfully"
          ls -lh build/Release/sqlanywhere.node
          file build/Release/sqlanywhere.node || true
        else
          echo "✗ Native module NOT found"
          exit 1
        fi
